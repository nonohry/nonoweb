# Jekyll - Overreacted Theme

title: Nono Heryana
author:
  name: Nono Heryana
  logo: "/assets/img/logo.jpeg"
  email: nonoheryana@gmail.com

# The `>` after `description:` means to ignore line-breaks until next key.
# If you want to omit the line-break after the end of text, use `>-` instead.
description: >
  Kumpulan renungan seorang penikmat ilmu, <br>
  yang percaya otak bukan sekadar hiasan kepala.

# Enter your Google Tag Manager container ID (e.g. GTM-MD35N24).
google_tag_manager: false

# Pagination
paginate: 10
paginate_path: /page-:num/

# Generate social links in footer.
social_links:
  - { platform: facebook, title: "", user_url: "https://www.facebook.com/nonohry" }
  - { platform: github, title: "", user_url: "https://github.com/nonohry" }
  - { platform: instagram, title: "", user_url: "https://www.instagram.com/logikanono" }
  - { platform: linkedin, title: "", user_url: "https://www.linkedin.com/in/nonohry" }
  - { platform: telegram, title: "", user_url: "https://t.me/sundawiwitan" }
  - { platform: twitter, title: "", user_url: "https://x.com/SundaWiwitanID" }
  - { platform: youtube, title: "", user_url: "https://www.youtube.com/nonohry" }

# You don't need to change any of the configuration flags below.

sass:
  style: :compressed

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jemoji
  